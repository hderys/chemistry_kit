<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🕵️ 偵探訓練：分析化學</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background: linear-gradient(145deg, #16203a 0%, #2a3a6a 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 6px;
        }

        .card {
            max-width: 900px;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            max-height: 100dvh;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            padding: 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 3px solid #d4a017;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .header-left select {
            font-size: 0.95rem;
            font-weight: 700;
            color: #2a3a6a;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 4px 0;
            max-width: 220px;
        }
        .header-left select option {
            font-weight: 600;
        }
        .title {
            font-size: 1.15rem;
            font-weight: 800;
            color: #1a2332;
            letter-spacing: -0.3px;
        }
        .lang-toggle {
            display: flex;
            gap: 2px;
            background: white;
            padding: 2px;
            border-radius: 30px;
            flex-shrink: 0;
            border: 1px solid #e2e8f0;
        }
        .lang-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #5a6a8a;
        }
        .lang-btn.active {
            background: #2a3a6a;
            color: white;
        }

        /* 已學到 選擇器 */
        .learn-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #f4f6fb;
            border-radius: 14px;
            padding: 6px 12px;
            flex-shrink: 0;
            margin-top: 4px;
            position: relative;
        }
        .learn-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #2a3a6a;
        }
        .learn-select {
            font-size: 0.95rem;
            font-weight: 700;
            color: #1a2332;
            border: 2px solid #d4a017;
            border-radius: 10px;
            padding: 4px 8px;
            background: white;
            cursor: pointer;
            outline: none;
        }
        .info-btn {
            border: none;
            background: #2a3a6a;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 1;
        }
        .info-popup {
            position: absolute;
            top: calc(100% + 6px);
            left: 10px;
            z-index: 20;
            background: #fff;
            border: 2px solid #d4a017;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #2a3a6a;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            display: none;
            max-width: 300px;
            line-height: 1.5;
        }
        .info-popup.show {
            display: block;
        }
        .unlock-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
            padding: 4px 0 0;
        }
        .chip {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 12px;
            border-radius: 20px;
            border: 2px solid transparent;
        }
        .chip.on {
            background: #dcfce7;
            color: #166534;
            border-color: #22c55e;
        }
        .chip.off {
            background: #f1f3f7;
            color: #8a94a6;
            border-color: #cbd2e0;
        }

        .tab-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 6px 0 4px;
            flex-shrink: 0;
        }
        .tab-btn {
            border: 2px solid #d4a017;
            background: white;
            padding: 6px 20px;
            border-radius: 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            color: #2a3a6a;
            transition: 0.15s;
        }
        .tab-btn.active {
            background: #2a3a6a;
            color: #ffd966;
            border-color: #2a3a6a;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #5a6a8a;
            font-weight: 600;
            padding: 2px 0;
            flex-shrink: 0;
        }

        .content-area {
            flex: 1;
            min-height: 0;
            padding: 0.3rem;
            overflow-y: auto;
            overflow-x: hidden;
            background: white;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e8ecf4;
        }
        .content-area::-webkit-scrollbar {
            width: 6px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: #c0c8d8;
            border-radius: 10px;
        }

        /* 手冊 */
        .handbook {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 4px;
        }
        .hb-group {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }
        .hb-group.locked {
            opacity: 0.55;
            background: #f5f6f8;
        }
        .hb-head {
            background: #2a3a6a;
            color: #ffd966;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 6px 12px;
        }
        .hb-head.locked {
            background: #8a94a6;
            color: white;
        }
        .hb-body {
            padding: 6px 12px;
            font-size: 0.9rem;
            color: #2a3a32;
            line-height: 1.6;
        }
        .hb-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
        }
        .hb-tag {
            font-weight: 700;
            color: #1a2332;
        }

        /* 翻頁書 */
        .book {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-height: 0;
            padding: 4px;
        }
        .book-page {
            flex: 1;
            min-height: 0;
            background: linear-gradient(135deg, #fffdf5 0%, #f7f3e3 100%);
            border: 2px solid #d4a017;
            border-radius: 6px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .book-page::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #d4a017 0 50%, #f7f3e3 50% 100%);
            border-bottom-left-radius: 5px;
        }
        .page-head {
            font-weight: 800;
            font-size: 1.05rem;
            color: #2a3a6a;
        }
        .page-head .hl-yellow {
            background: #ffeb3b;
            padding: 0 4px;
            border-radius: 4px;
            font-weight: 800;
        }
        .page-head.locked {
            color: #8a94a6;
        }
        .page-body {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            font-size: 0.92rem;
            color: #2a3a32;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .page-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }
        .locked-text {
            color: #8a94a6;
            font-weight: 600;
        }
        .book-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        .book-btn {
            border: 2px solid #d4a017;
            background: white;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            font-size: 1.1rem;
            cursor: pointer;
            color: #2a3a6a;
            font-weight: 700;
        }
        .book-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .book-count {
            font-weight: 700;
            color: #2a3a6a;
            font-size: 0.95rem;
        }

        /* 訓練 */
        .q-text {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1a2332;
            text-align: center;
            padding: 10px 6px;
            flex-shrink: 0;
        }
        .q-options {
            display: grid;
            gap: 8px;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .q-options.cols2 {
            grid-template-columns: 1fr 1fr;
        }
        .q-options.cols4 {
            grid-template-columns: 1fr 1fr;
        }
        .opt-btn {
            border: 2px solid #d0d8e8;
            background: white;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: #2a3a6a;
            min-height: 46px;
            transition: 0.15s;
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
            text-align: center;
        }
        .opt-btn:hover:not(:disabled) {
            background: #eef4fc;
        }
        .opt-btn.selected {
            border-color: #2a3a6a;
            background: #2a3a6a;
            color: white;
        }
        .opt-btn.correct {
            border-color: #22c55e;
            background: #22c55e;
            color: white;
        }
        .opt-btn.wrong {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }
        .opt-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback-area {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            background: #e8f5e8;
            border: 2px solid #6bcb77;
            color: #0d553a;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-height: 42px;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .feedback-area.error {
            background: #fce8e8;
            border-color: #e74c3c;
            color: #7a2a2a;
        }
        .fb-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fb-text {
            font-weight: 700;
        }
        .fb-detail {
            font-size: 0.9rem;
            font-weight: 500;
            color: #5a5a7a;
            padding-left: 28px;
        }

        .bottom-check-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 4px 0 0;
            flex-shrink: 0;
        }
        .btn-check {
            background: linear-gradient(145deg, #d4a017, #b8860b);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 22px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 38px;
            white-space: nowrap;
        }
        .btn-check:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-next-question {
            background: linear-gradient(145deg, #4a6a9a, #2a3a6a);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 38px;
            white-space: nowrap;
        }

        /* 開場彈窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 40, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: #fff;
            border: 3px solid #d4a017;
            border-radius: 18px;
            padding: 24px 28px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }
        .modal-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: #1a2332;
        }
        .modal-sub {
            font-size: 1rem;
            font-weight: 600;
            color: #5a6a8a;
            margin: 8px 0 16px;
        }
        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal-ch {
            border: 2px solid #d4a017;
            background: white;
            border-radius: 12px;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            color: #2a3a6a;
            cursor: pointer;
        }
        .modal-ch:hover {
            background: #fff8e1;
        }
        .modal-note {
            font-size: 0.8rem;
            color: #8a94a6;
            margin-top: 12px;
            font-weight: 600;
        }

        /* 進階提示（Out of Syllabus） */
        .page-row.extra {
            color: #7a3e9d;
            background: #f5effa;
            border-radius: 8px;
            padding: 4px 8px;
            font-weight: 600;
        }

        /* ===== 案件偵破 ===== */
        .case-head {
            font-size: 0.95rem;
            font-weight: 800;
            color: #1a2332;
            text-align: center;
            padding: 2px 0;
            flex-shrink: 0;
        }
        .case-bottle {
            background: #f7f3e3;
            border: 2px solid #d4a017;
            border-radius: 10px;
            padding: 4px 10px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 800;
            color: #2a3a6a;
            flex-shrink: 0;
        }
        .toolkit {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .tk-btn {
            border: 2px solid #d4a017;
            background: white;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #2a3a6a;
            cursor: pointer;
            transition: 0.15s;
        }
        .tk-btn:hover:not(:disabled) {
            background: #fff8e1;
        }
        .tk-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            text-decoration: line-through;
        }
        .clues-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #2a3a6a;
            padding: 4px 0 2px;
            flex-shrink: 0;
        }
        .clues {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 8px;
            background: #f4f6fb;
            border-radius: 10px;
            flex: 0 1 auto;
            min-height: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        .clue-line {
            font-size: 0.9rem;
            color: #2a3a32;
            line-height: 1.5;
        }
        .clue-test {
            font-weight: 700;
            color: #1a2332;
        }
        .clue-res {
            font-weight: 600;
            color: #4a5a7a;
        }
        .identify-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 4px 0 2px;
            flex-shrink: 0;
        }
        .suspect-select {
            font-size: 1rem;
            font-weight: 700;
            color: #1a2332;
            border: 2px solid #d4a017;
            border-radius: 10px;
            padding: 6px 8px;
            background: white;
            cursor: pointer;
            outline: none;
            max-width: 260px;
        }
        @media (min-height: 900px) {
            .clues {
                max-height: 240px;
            }
        }

        .case-instruct {
            font-size: 0.85rem;
            font-weight: 700;
            color: #7a3e9d;
            text-align: center;
            padding: 2px 0;
            flex-shrink: 0;
        }
        .proc-vis {
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            color: #2a3a6a;
            padding: 8px 0 4px;
        }
        .proc-q {
            font-size: 1rem;
            font-weight: 700;
            color: #1a2332;
            text-align: center;
            margin: 8px 0;
        }
        .proc-opts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            justify-items: stretch;
        }
        .proc-opt {
            border: 2px solid #d4a017;
            background: white;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #2a3a6a;
            cursor: pointer;
            text-align: center;
            min-height: 42px;
            line-height: 1.3;
        }
        .proc-opt:hover {
            background: #fff8e1;
        }
        .proc-opt.selected {
            background: #2a3a6a;
            color: #ffd966;
            border-color: #2a3a6a;
        }
        .modal-err {
            color: #e74c3c;
            font-weight: 700;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 10px;
            min-height: 1.2em;
        }

        /* 測試結果彈窗 */
        .res-head {
            font-size: 1.3rem;
            font-weight: 800;
            color: #2a3a6a;
            text-align: center;
        }
        .res-vis {
            text-align: center;
            padding: 16px 0 8px;
            font-size: 2.2rem;
            line-height: 1.2;
        }
        .res-vis .flame {
            width: 42px;
            height: 60px;
        }
        .res-vis .tube {
            width: 40px;
            height: 72px;
        }
        .res-vis .splint {
            height: 48px;
            width: 8px;
        }
        .res-vis .splint.glow::after {
            width: 26px;
            height: 26px;
            top: -10px;
            left: -9px;
        }
        .res-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a2332;
            text-align: center;
            padding: 4px 0 14px;
            line-height: 1.4;
        }
        .res-btn {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
        }

        /* 測試視覺 */
        .tube {
            display: inline-block;
            width: 26px;
            height: 46px;
            border: 2px solid #99a;
            border-radius: 0 0 10px 10px;
            background: #eef2f7;
            vertical-align: middle;
            position: relative;
        }
        .tube.milky {
            background: #fff;
        }
        .tube.clear {
            background: rgba(200, 220, 240, 0.4);
        }
        .tube.ppt::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 4px;
            right: 4px;
            height: 10px;
            background: #fff;
            border-radius: 4px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.3);
        }
        .flame {
            display: inline-block;
            width: 18px;
            height: 26px;
            background: var(--fc);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            vertical-align: middle;
            box-shadow: 0 0 12px var(--fc);
        }
        .splint {
            display: inline-block;
            width: 6px;
            height: 34px;
            background: #b0743a;
            border-radius: 3px;
            vertical-align: middle;
            position: relative;
        }
        .splint.glow::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -5px;
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #ffd54f, #ff8f00);
            border-radius: 50%;
            box-shadow: 0 0 10px #ff8f00;
        }
        .splint.out::after {
            content: '💨';
            position: absolute;
            top: -12px;
            left: 4px;
            font-size: 0.8rem;
        }

        /* 版面壓縮 */
        @media (min-width: 769px) {
            .card {
                padding: 0.3rem 0.6rem;
            }
            .title {
                font-size: 1rem;
            }
            .learn-row {
                padding: 4px 10px;
                margin-top: 2px;
            }
            .chip {
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .unlock-bar {
                padding: 2px 0 0;
            }
            .tab-row {
                padding: 4px 0 2px;
            }
            .tab-btn {
                padding: 5px 16px;
                font-size: 0.9rem;
            }
            .score-row {
                font-size: 0.78rem;
                padding: 1px 0;
            }
            .book-page {
                min-height: 200px;
                padding: 14px 18px;
                gap: 8px;
            }
            .book-btn {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .book-nav {
                gap: 10px;
            }
            .content-area {
                padding: 0.2rem;
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 0.3rem 0.4rem;
                border-radius: 16px;
            }
            .title {
                font-size: 0.9rem;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 3px;
            }
            .header-left {
                justify-content: space-between;
            }
            .header-right {
                display: flex;
                justify-content: flex-end;
            }
            .lang-btn {
                padding: 3px 10px;
                font-size: 0.8rem;

            // ---------- 氣體測試 (Ch.2) ----------

                    if (g.test_zh) {
                        qs.push({
                            q_zh: '把' + g.test_zh + '放入氣體，' + g.obs_zh + '。這是哪種氣體？',

                    // 氣體 → 測試

                        qs.push({

                            ex_en: g.en + ': ' + g.test_en + ' → ' + g.obs_en,

                        ex_en: f.ion + ': the flame is ' + f.c_en + '.',

                        ex_zh: f.sub_zh + '含 ' + f.ion + '，焰色為' + f.c_zh + '。',
                        ex_en: f.sub_en + ' contains ' + f.ion + '; the flame is ' + f.c_en + '.',

                    q_zh: '焰色測試前，白金絲應先蘸甚麼？',

            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function draw() {
            if (S.tab !== 'train') return;
            if (S.deck.length === 0) {
                S.deck = shuffle(S.bank);

                S.roundTotal = S.bank.length;
            }
            const q = S.deck.pop();

            document.getElementById('qText').textContent = currentLang === 'zh' ? q.q_zh : q.q_en;
            const g = document.getElementById('optGroup');
            g.className = 'q-options ' + (q.o_zh.length <= 2 ? 'cols2' : 'cols4');
            g.innerHTML = '';

                const b = document.createElement('button');
                b.className = 'opt-btn';
                b.textContent = label;
                b.dataset.index = i;
                b.onclick = function() {
                    if (S.isAnswered) return;
                    g.querySelectorAll('.opt-btn').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    S.selected = i;
                    document.getElementById('checkBtn').disabled = false;

            });

            document.getElementById('nextBtn').style.display = 'none';

        function check() {
            if (S.isAnswered || !S.q) return;
            if (S.selected === null) {
                setFeedback('⚠️', t('pick'), '', true);
                return;
            }
            S.isAnswered = true;
            S.total++;
            const isCorrect = (S.selected === S.q.correct);
            if (isCorrect) S.correct++;

            const opts = document.querySelectorAll('#optGroup .opt-btn');
            opts.forEach(b => {
                b.disabled = true;
                const i = parseInt(b.dataset.index, 10);
                if (i === S.q.correct) b.classList.add('correct');
                else if (i === S.selected && !isCorrect) b.classList.add('wrong');
            });

            const correctLabel = opts[S.q.correct] ? opts[S.q.correct].textContent : '';
            const explain = currentLang === 'zh' ? S.q.ex_zh : S.q.ex_en;
            if (isCorrect) {
                setFeedback('🕵️', t('correct'), explain, false);
            } else {
                setFeedback('🔍', t('wrong') + correctLabel, explain, true);
            }

            document.getElementById('nextBtn').style.display = 'inline-block';

        }

        function visHTML(v) {
            if (v === 'relight') return '<span class="splint glow"></span>';
            if (v === 'out') return '<span class="splint out"></span>';
            if (v === 'milky') return '<span class="tube milky"></span>';
            if (v === 'clear') return '<span class="tube clear"></span>';
            if (v === 'pop') return '💥';
            if (v === 'none') return '—';
            if (v && v.indexOf('flame_') === 0) return '<span class="flame" style="--fc:' + FLAME_VIS[v] + '"></span>';
            if (v === 'ppt_white') return '<span class="tube ppt"></span>';
            if (v === 'bubbles') return '<span class="tube milky"></span> 🫧';
            if (v === 'bubble') return '🫧';
            if (v === 'balloon_up') return '🎈⬆️';
            if (v === 'balloon_down') return '🎈⬇️';
            return '';
        }

        function runTest(t, btn) {
            if (!S.case) return;
            if (S.case.used[t]) return;
            const proc = CASE_PROCEDURES[t];
            if (!proc) {
                revealTest(t, btn);
                return;
            }
            S.proc = { test: t, btn: btn, step: 0, steps: proc };
            renderProcStep();
        }

        function renderProcStep() {
            const p = S.proc;
            const st = p.steps[p.step];
            document.getElementById('procModal').style.display = 'flex';
            document.getElementById('procErr').textContent = '';
            const vis = document.getElementById('procVis');
            if (st.pre_vis) {
                vis.style.display = 'block';
                vis.innerHTML = (currentLang === 'zh' ? st.pre_zh : st.pre_en) + ' ' + visHTML(st.pre_vis);
            } else {
                vis.style.display = 'none';
            }
            document.getElementById('procQ').textContent = currentLang === 'zh' ? st.q_zh : st.q_en;

            // 洗牌選項，記錄正解位置
            const n = st.opts_zh.length;
            const idx = [];
            for (let i = 0; i < n; i++) idx.push(i);
            for (let i = n - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [idx[i], idx[j]] = [idx[j], idx[i]];
            }
            p.curCorrect = idx.indexOf(st.correct);

            const opts = document.getElementById('procOpts');
            opts.innerHTML = '';
            idx.forEach(orig => {
                const b = document.createElement('button');
                b.className = 'proc-opt';
                b.textContent = currentLang === 'zh' ? st.opts_zh[orig] : st.opts_en[orig];
                b.onclick = function() {
                    opts.querySelectorAll('.proc-opt').forEach(x => x.classList.remove('selected'));
                    b.classList.add('selected');
                    procAnswer();
                };
                opts.appendChild(b);
            });
        }

        function procAnswer() {
            const p = S.proc;
            if (!p) return;
            const opts = document.getElementById('procOpts').children;
            let chosen = -1;
            for (let i = 0; i < opts.length; i++) {
                if (opts[i].classList.contains('selected')) { chosen = i; break; }
            }
            if (chosen === -1) {
                document.getElementById('procErr').textContent = currentLang === 'zh' ? '⚠️ 請選擇一個答案' : '⚠️ Please select an answer';
                return;
            }
            if (chosen === p.curCorrect) {
                document.getElementById('procErr').textContent = '';
                if (p.step < p.steps.length - 1) {
                    p.step++;
                    renderProcStep();
                } else {
                    document.getElementById('procModal').style.display = 'none';
                    revealTest(p.test, p.btn);
                    S.proc = null;
                }
            } else {
                document.getElementById('procErr').textContent = currentLang === 'zh' ? '⚠️ 程序錯誤，再試一次' : '⚠️ Wrong procedure, try again';
            }
        }

        function revealTest(t, btn) {
            if (S.case.used[t]) return;
            S.case.used[t] = true;
            if (btn) btn.disabled = true;
            const res = S.case.mystery.results[t];
            if (!res) return;
            S.pendingClue = { test: t, res: res };
            document.getElementById('resHead').textContent = currentLang === 'zh' ? '🔍 發現線索！' : '🔍 Clue found!';
            document.getElementById('resVis').innerHTML = visHTML(res.v);
            document.getElementById('resText').textContent = res[currentLang === 'zh' ? 'zh' : 'en'];
            document.getElementById('resConfirm').textContent = currentLang === 'zh' ? '✓ 記錄線索' : '✓ Record clue';
            document.getElementById('resultModal').style.display = 'flex';
        }

        function confirmClue() {
            document.getElementById('resultModal').style.display = 'none';
            if (!S.pendingClue) return;
            const t = S.pendingClue.test;
            const res = S.pendingClue.res;
            S.pendingClue = null;
            S.case.clues.push({ test: t, res: res });
            const clues = document.getElementById('clues');
            if (S.case.clues.length === 1) clues.innerHTML = '';
            const line = document.createElement('div');
            line.className = 'clue-line';
            const testLabel = CASE_TESTS[t][currentLang === 'zh' ? 'zh' : 'en'];
            const resText = res[currentLang === 'zh' ? 'zh' : 'en'];
            line.innerHTML = '<span class="clue-test">' + testLabel + '</span> → ' + visHTML(res.v) +
                ' <span class="clue-res">' + resText + '</span>';
            clues.appendChild(line);
            setFeedback('🔍', currentLang === 'zh' ? '線索已記錄' : 'Clue recorded', '', false);
        }

        function renderCase() {
            const area = document.getElementById('contentArea');
            document.querySelector('.score-row').style.display = 'none';
            area.innerHTML = '';

            const head = document.createElement('div');
            head.className = 'case-head';
            head.id = 'caseHead';
            area.appendChild(head);

            const instruct = document.createElement('div');
            instruct.className = 'case-instruct';
            instruct.id = 'caseInstruct';
            area.appendChild(instruct);

            const tk = document.createElement('div');
            tk.className = 'toolkit';
            tk.id = 'toolkit';
            area.appendChild(tk);

            const cluesTitle = document.createElement('div');
            cluesTitle.className = 'clues-title';
            cluesTitle.id = 'cluesTitle';
            area.appendChild(cluesTitle);

            const clues = document.createElement('div');
            clues.className = 'clues';
            clues.id = 'clues';
            area.appendChild(clues);

            const idRow = document.createElement('div');
            idRow.className = 'identify-row';
            idRow.innerHTML = '<select class="suspect-select" id="suspectSelect"></select>' +
                '<button class="btn-check" id="arrestBtn"></button>';
            area.appendChild(idRow);

            setFeedback('✏️', currentLang === 'zh' ? '對未知物做測試，收集線索後指認物質！' : 'Run tests to gather clues, then identify the substance!', '', false);

            const bottom = document.createElement('div');
            bottom.className = 'bottom-check-row';
            bottom.innerHTML = '<button class="btn-next-question" id="nextCaseBtn" style="display:none;"></button>';
            area.appendChild(bottom);

            document.getElementById('arrestBtn').textContent = currentLang === 'zh' ? '🕵️ 指認物質' : '🕵️ Identify';
            document.getElementById('nextCaseBtn').textContent = currentLang === 'zh' ? '➡️ 下一案件' : '➡️ Next case';
            document.getElementById('arrestBtn').addEventListener('click', arrest);
            document.getElementById('nextCaseBtn').addEventListener('click', newCase);

            newCase();
        }

        function newCase() {
            const unlockedCats = [];
            if (currentChapter >= 2) unlockedCats.push('gas');
            if (currentChapter >= 3) unlockedCats.push('solution');
            if (currentChapter >= 4) unlockedCats.push('solid');
            const cat = unlockedCats[Math.floor(Math.random() * unlockedCats.length)];
            const list = MYSTERIES[cat];
            const mystery = list[Math.floor(Math.random() * list.length)];

            S.case = { cat: cat, mystery: mystery, clues: [], used: {} };
            S.proc = null;
            S.pendingClue = null;

            document.getElementById('caseHead').textContent = '🕵️ ' +
                (currentLang === 'zh' ? '案件 #' + (S.casesSolved + 1) + '（已破案 ' + S.casesSolved + '）｜未知' + CAT_LABEL[cat].zh + ' 🧪?'
                    : 'Case #' + (S.casesSolved + 1) + ' (solved ' + S.casesSolved + ') | unknown ' + CAT_LABEL[cat].en + ' 🧪?');
            document.getElementById('caseInstruct').textContent = currentLang === 'zh' ? '進行甚麼測試好呢？' : 'What test should you perform?';
            document.getElementById('procModal').style.display = 'none';
            document.getElementById('resultModal').style.display = 'none';

            const tk = document.getElementById('toolkit');
            tk.innerHTML = '';
            CAT_TOOLKIT[cat].forEach(t => {
                const b = document.createElement('button');
                b.className = 'tk-btn';
                b.dataset.test = t;
                b.textContent = CASE_TESTS[t][currentLang === 'zh' ? 'zh' : 'en'];
                b.onclick = function() { runTest(t, b); };
                tk.appendChild(b);
            });

            const sel = document.getElementById('suspectSelect');
            sel.innerHTML = '';
            list.forEach(m => {
                const o = document.createElement('option');
                o.value = m.id;
                o.textContent = currentLang === 'zh' ? m.zh : m.en;
                sel.appendChild(o);
            });

            document.getElementById('cluesTitle').textContent = currentLang === 'zh' ? '🔎 已收集線索：' : '🔎 Clues collected:';
            document.getElementById('clues').innerHTML = currentLang === 'zh' ? '（尚未做任何測試）' : '(no tests yet)';
            document.getElementById('arrestBtn').disabled = false;
            document.getElementById('nextCaseBtn').style.display = 'none';
            setFeedback('🔍', currentLang === 'zh' ? '選擇一個測試開始調查' : 'Pick a test to start investigating', '', false);
            updateScore();
        }

        function arrest() {
            if (!S.case || !S.case.mystery) return;
            const sel = document.getElementById('suspectSelect');
            const chosen = sel.value;
            if (chosen === S.case.mystery.id) {
                S.casesSolved++;
                document.getElementById('arrestBtn').disabled = true;
                let detail = currentLang === 'zh' ? '你透過測試線索找出了它！' : 'You identified it through the tests!';
                if (S.case.mystery.id === 'N2') {
                    detail += ' ' + (currentLang === 'zh'
                        ? '💡 進階：Ar、Ne 等貴氣體也沒有簡單測試，結果相同'
                        : '💡 Advanced: Ar and Ne (noble gases) have no simple test and give the same result');
                }
                if (S.case.mystery.id === 'CO2') {
                    detail += ' ' + (currentLang === 'zh'
                        ? '💡 也有可能是 SO₂（SO₂ 也使石灰水變奶白）'
                        : '💡 It could also be SO₂ (SO₂ also turns limewater milky)');
                }
                if (S.case.mystery.id.indexOf('CO3') !== -1) {
                    detail += ' ' + (currentLang === 'zh'
                        ? '💡 也有可能是碳酸氫鹽（hydrogencarbonate）'
                        : '💡 It could also be a hydrogencarbonate');
                }
                setFeedback('🕵️',
                    currentLang === 'zh' ? '破案！正確是 ' + S.case.mystery.zh : 'Case solved! It is ' + S.case.mystery.en,
                    detail,
                    false);
                document.getElementById('nextCaseBtn').style.display = 'inline-block';
                updateScore();
            } else {
                const chosenM = MYSTERIES[S.case.cat].find(m => m.id === chosen);
                const label = chosenM ? (currentLang === 'zh' ? chosenM.zh : chosenM.en) : chosen;
                setFeedback('🔍',
                    currentLang === 'zh' ? '不是' + label + '！再測試多一點線索吧' : 'Not ' + label + '! Gather more clues',
                    '', true);
            }
        }

        // ============================================================
        // 分頁 / 章節 / 語言
        // ============================================================
        function switchTab(tab) {
            if (S.tab === tab) return;
            S.tab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            render();
        }

        function setChapter(ch) {
            currentChapter = parseInt(ch, 10);
            localStorage.setItem('detective_chapter', String(currentChapter));
            S.bank = buildBank(currentChapter);
            S.deck = [];
            renderUnlockBar();
            document.getElementById('infoPopup').textContent = t('learnNote');
            if (S.tab === 'train') {
                renderTrain();
                draw();
            } else if (S.tab === 'case') {
                renderCase();
            } else {
                renderHandbook();
            }
        }

        function showChapterModal() {
            document.getElementById('modalTitle').textContent = t('modalTitle');
            document.getElementById('modalSub').textContent = t('modalSub');
            document.getElementById('modalNote').textContent = t('modalNote');
            document.getElementById('chapterModal').style.display = 'flex';
            document.querySelectorAll('.modal-ch').forEach(b => {
                b.onclick = function() {
                    setChapter(parseInt(this.dataset.ch, 10));
                    document.getElementById('chapterSelect').value = this.dataset.ch;
                    document.getElementById('chapterModal').style.display = 'none';
                };
            });
        }

        function render() {
            document.getElementById('procModal').style.display = 'none';
            document.getElementById('resultModal').style.display = 'none';
            if (S.tab === 'handbook') renderHandbook();
            else if (S.tab === 'train') {
                renderTrain();
                draw();
            } else if (S.tab === 'case') {
                renderCase();
            }
        }

        function setLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url);
            localStorage.setItem('detective_lang', lang);
            updateButtonLabels();
            render();
        }

        function updateButtonLabels() {
            document.getElementById('learnLabel').textContent = t('learnLabel');
            document.getElementById('infoPopup').textContent = t('learnNote');
            document.getElementById('tabHandbook').textContent = t('tabHandbook');
            document.getElementById('tabTrain').textContent = t('tabTrain');
            document.getElementById('tabCase').textContent = t('tabCase');
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

            const sel = document.getElementById('practiceSelector');
            if (sel) {
                const labels = {
                    home: currentLang === 'zh' ? '🏠 返回目錄' : '🏠 Home',
                    ch1: currentLang === 'zh' ? '⚗️ 儀器與標籤 (Ch.1)' : '⚗️ Apparatus & Labels (Ch.1)',
                    ch2: currentLang === 'zh' ? '🔬 特性變化分類 (Ch.2)' : '🔬 Properties & Changes (Ch.2)',
                    detective: currentLang === 'zh' ? '🕵️ 偵探訓練' : '🕵️ Detective Training',
                    ions: currentLang === 'zh' ? '🧪 離子與化合物 (Ch.7)' : '🧪 Ionic Compounds (Ch.7)',
                    structure: currentLang === 'zh' ? '🏗️ 結構 (Ch.9)' : '🏗️ Structure (Ch.9)',
                    rxn: currentLang === 'zh' ? '⚙️ 金屬反應 (Ch.11)' : '⚙️ Metal Reactions (Ch.11)',
                };
                for (let i = 0; i < sel.options.length; i++) {
                    const val = sel.options[i].value;
                    if (labels[val]) sel.options[i].textContent = labels[val];
                }
            }
            updateScore();
        }

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            const urlLang = new URLSearchParams(window.location.search).get('lang') || localStorage.getItem('detective_lang') || 'zh';
            currentLang = (urlLang === 'zh' || urlLang === 'en') ? urlLang : 'zh';

            const savedCh = localStorage.getItem('detective_chapter');
            if (savedCh && ['2', '3', '4'].includes(savedCh)) currentChapter = parseInt(savedCh, 10);

            document.querySelectorAll('.lang-btn').forEach(b => {
                b.addEventListener('click', () => setLanguage(b.dataset.lang));
            });
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.addEventListener('click', () => switchTab(b.dataset.tab));
            });
            document.getElementById('chapterSelect').addEventListener('change', function() {
                setChapter(this.value);
            });

            document.getElementById('infoBtn').addEventListener('click', function(e) {
                e.stopPropagation();
                document.getElementById('infoPopup').classList.toggle('show');
            });
            document.addEventListener('click', function() {
                document.getElementById('infoPopup').classList.remove('show');
            });
            document.getElementById('resConfirm').addEventListener('click', confirmClue);

            const sel = document.getElementById('practiceSelector');
            if (sel) {
                sel.addEventListener('change', function() {
                    const target = this.value;
                    if (target === 'home') window.location.href = 'index.html?lang=' + currentLang;
                    else window.location.href = target + '.html?lang=' + currentLang;
                });
            }

            updateButtonLabels();
            document.getElementById('chapterSelect').value = String(currentChapter);
            setChapter(currentChapter);
            render();
            showChapterModal();
            console.log('🕵️ 偵探訓練已啟動');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
