<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🏗️ 結構練習 · Ch.9</title>
    <base href="./">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background: linear-gradient(145deg, #f0f4ff 0%, #d4dcec 100%);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 4px;
        }

        .card {
            max-width: 1100px;
            width: 100%;
            height: 98vh;
            max-height: 98vh;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(40, 60, 120, 0.12);
            padding: 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(180, 200, 220, 0.25);
        }

        .header {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex-shrink: 0;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }
        .header-left select {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2a3a6a;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 2px 0;
            max-width: 200px;
        }
        .header-left select option {
            font-weight: 600;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .lang-toggle {
            display: flex;
            gap: 2px;
            background: white;
            padding: 2px;
            border-radius: 30px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }
        .lang-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            background: transparent;
            color: #5a6a8a;
        }
        .lang-btn.active {
            background: #4a6a9a;
            color: white;
            box-shadow: 0 2px 8px rgba(74, 106, 154, 0.3);
        }
        .lang-btn:hover:not(.active) {
            background: #e8eef8;
        }

        .question-area {
            flex: 1;
            min-width: 0;
            padding: 0.1rem 0.3rem;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 14px;
            background: white;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        .question-area::-webkit-scrollbar {
            width: 6px;
        }
        .question-area::-webkit-scrollbar-thumb {
            background: #c0c8d8;
            border-radius: 10px;
        }

        .split-panel {
            display: flex;
            gap: 4px;
            flex: 1;
            min-height: 0;
            align-items: flex-start;
        }
        .split-left {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
            min-height: 0;
            height: 100%;
        }

        .hint-row-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 4px 8px;
            flex-shrink: 0;
            padding: 2px 0;
        }
        .hint-row-wrap .hint-text {
            font-size: 1rem;
            color: #6a7a8a;
            flex: 1;
            min-width: 150px;
        }
        .hint-row-wrap .hint-text .highlight {
            color: #e74c3c;
            font-weight: 700;
        }

        .step-progress {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            padding: 4px 0;
            justify-content: center;
            flex-wrap: wrap;
        }
        .step-dot {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #b0bcca;
            padding: 4px 14px;
            border-radius: 20px;
            background: #f0f4f8;
            transition: 0.3s;
            border: 2px solid transparent;
        }
        .step-dot.active {
            background: #1a2332;
            color: white;
            border-color: #1a2332;
        }
        .step-dot.done {
            background: #dcfce7;
            color: #166534;
            border-color: #22c55e;
        }
        .step-dot .num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            font-size: 10px;
            font-weight: 700;
        }

        @media (min-width: 769px) {
            .step-progress {
                display: flex;
            }
        }

        @media (max-width: 768px) {
            .step-progress {
                display: flex !important;
            }
            .step-dot .step-label {
                display: inline !important;
            }
        }

        .top-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 4px 10px;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .top-row .spin-box {
            background: #f0f4fc;
            border-radius: 10px;
            padding: 3px 12px;
            border: 2px solid #c8d4e8;
            text-align: center;
            min-width: 55px;
        }
        .top-row .spin-box .label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #5a6a8a;
        }
        .top-row .spin-box .value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2a3a6a;
            min-height: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
        }
        .top-row .btn-spin {
            background: linear-gradient(145deg, #6a8aba, #4a6a9a);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 22px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(74, 106, 154, 0.3);
            min-height: 40px;
            white-space: nowrap;
            min-width: 80px;
        }
        .top-row .btn-spin:hover:not(:disabled) {
            transform: scale(1.03);
        }
        .top-row .btn-spin:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .top-row .btn-spin.spinning {
            animation: pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.03);
                opacity: 0.8;
            }
        }
        .top-row .operator-plus {
            font-size: 1.2rem;
            font-weight: 700;
            color: #6a8aba;
        }

        .q-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            padding: 2px 0;
            transition: all 0.3s ease;
        }
        .q-row.hidden {
            display: none !important;
        }

        .q-label {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4a5a7a;
            min-width: 60px;
        }

        .q-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .q-options .opt-btn {
            border: 2px solid #d0d8e8;
            background: white;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            color: #2a3a6a;
            min-height: 36px;
            white-space: nowrap;
        }
        .q-options .opt-btn:hover:not(:disabled) {
            background: #eef4fc;
        }
        .q-options .opt-btn.selected {
            border-color: #4a6a9a;
            background: #4a6a9a;
            color: white;
        }
        .q-options .opt-btn.correct {
            border-color: #22c55e;
            background: #22c55e;
            color: white;
        }
        .q-options .opt-btn.wrong {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }
        .q-options .opt-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .formula-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            padding: 2px 0;
            width: 100%;
        }
        .formula-row input {
            padding: 6px 14px;
            font-size: 1.2rem;
            font-weight: 600;
            border: 3px solid #d0c0e0;
            border-radius: 12px;
            background: white;
            text-align: center;
            transition: 0.15s;
            color: #2a1a3a;
            outline: none;
            width: 200px;
            height: 48px;
        }
        .formula-row input.correct {
            border-color: #22c55e;
            background: #ecfdf5;
        }
        .formula-row input.incorrect {
            border-color: #ef4444;
            background: #fce4e7;
        }
        .formula-row input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .formula-row .formula-hint {
            font-size: 0.8rem;
            color: #8a9aaa;
            font-weight: 500;
        }

        .structure-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            width: 100%;
            max-width: 480px;
        }
        .structure-grid .opt-btn {
            padding: 10px 12px;
            font-size: 0.85rem;
            min-height: 44px;
            border-radius: 14px;
            text-align: center;
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
            border: 2px solid #d0d8e8;
            background: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            color: #2a3a6a;
        }
        .structure-grid .opt-btn:hover:not(:disabled) {
            background: #eef4fc;
        }
        .structure-grid .opt-btn.selected {
            border-color: #4a6a9a;
            background: #4a6a9a;
            color: white;
        }
        .structure-grid .opt-btn.correct {
            border-color: #22c55e;
            background: #22c55e;
            color: white;
        }
        .structure-grid .opt-btn.wrong {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }
        .structure-grid .opt-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .prop-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 4px 0;
            flex-shrink: 0;
            width: 100%;
        }
        .prop-section .prop-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #4a5a7a;
        }
        .prop-section .prop-title .multi-hint {
            font-size: 0.7rem;
            color: #e67e22;
            font-weight: 600;
            background: #fef9e7;
            padding: 1px 8px;
            border-radius: 12px;
            border: 1px solid #f39c12;
            margin-left: 6px;
        }

        .prop-group-wrap {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 10px;
            padding: 2px 0;
        }
        .prop-group-wrap .cat-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #6a7a8a;
            min-width: 44px;
        }
        .prop-group {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            flex: 1;
        }
        .prop-group .prop-btn {
            border: 2px solid #d0d8e8;
            background: white;
            padding: 3px 14px;
            border-radius: 18px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            color: #3a4a6a;
            min-height: 30px;
            white-space: nowrap;
        }
        .prop-group .prop-btn:hover:not(:disabled) {
            background: #eef4fc;
        }
        .prop-group .prop-btn.selected {
            border-color: #4a6a9a;
            background: #4a6a9a;
            color: white;
        }
        .prop-group .prop-btn.correct {
            border-color: #22c55e;
            background: #22c55e;
            color: white;
        }
        .prop-group .prop-btn.wrong {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }
        .prop-group .prop-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .soluble-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 12px;
            padding: 2px 0;
            width: 100%;
        }
        .soluble-row .sol-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5a7a;
            min-width: 100px;
        }
        .soluble-row .sol-options {
            display: flex;
            gap: 6px;
        }
        .soluble-row .sol-options button {
            border: 2px solid #d0d8e8;
            background: white;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            color: #2a3a6a;
            min-height: 34px;
        }
        .soluble-row .sol-options button:hover:not(:disabled) {
            background: #eef4fc;
        }
        .soluble-row .sol-options button.selected {
            border-color: #4a6a9a;
            background: #4a6a9a;
            color: white;
        }
        .soluble-row .sol-options button.correct {
            border-color: #22c55e;
            background: #22c55e;
            color: white;
        }
        .soluble-row .sol-options button.wrong {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }
        .soluble-row .sol-options button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .reacts-hint {
            display: inline-block;
            line-height: 1.2;
            font-size: 0.9rem;
            font-weight: 700;
            color: #e67e22;
            background: #fef9e7;
            padding: 4px 16px;
            border-radius: 30px;
            border: 2px solid #f39c12;
            margin-left: 4px;
            vertical-align: middle;
        }

        .feedback-area {
            padding: 8px 18px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            background: #e8f5e8;
            border: 2px solid #6bcb77;
            color: #0d553a;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
            min-height: 44px;
            transition: 0.2s;
            flex-shrink: 0;
            margin-top: 6px;
        }
        .feedback-area.error {
            background: #fce8e8;
            border-color: #e74c3c;
            color: #7a2a2a;
        }
        .feedback-area .fb-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .feedback-area .fb-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .feedback-area .fb-text {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .feedback-area .fb-detail {
            font-size: 1rem;
            font-weight: 500;
            color: #5a5a7a;
            padding-left: 30px;
        }

        .bottom-check-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 6px 0 0 0;
            margin-top: 4px;
            border-top: 2px dashed #d0d8e8;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-check {
            background: linear-gradient(145deg, #f5a623, #e0941a);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 4px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 20px rgba(245, 166, 35, 0.3);
            min-height: 36px;
            white-space: nowrap;
        }
        .btn-check:hover:not(:disabled) {
            transform: scale(1.03);
        }
        .btn-check:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-next-question {
            background: linear-gradient(145deg, #6a8aba, #4a6a9a);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 4px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            min-height: 36px;
            white-space: nowrap;
            box-shadow: 0 2px 10px rgba(74, 106, 154, 0.3);
        }
        .btn-next-question:hover:not(:disabled) {
            transform: scale(1.03);
        }
        .btn-next-question:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        @media (min-width: 769px) {
            .card {
                padding: 0.3rem 0.8rem;
                height: 96vh;
                max-height: 96vh;
            }
            .header-left select {
                font-size: 0.9rem;
                max-width: 170px;
            }
            .top-row .spin-box .value {
                font-size: 1.1rem;
            }
            .top-row .btn-spin {
                padding: 4px 16px;
                font-size: 0.85rem;
                min-height: 32px;
            }
            .q-options .opt-btn {
                font-size: 0.9rem;
                padding: 3px 14px;
                min-height: 30px;
            }
            .feedback-area {
                padding: 4px 14px;
                min-height: 34px;
                font-size: 0.9rem;
            }
            .structure-grid {
                max-width: 420px;
            }
            .structure-grid .opt-btn {
                font-size: 0.8rem;
                padding: 8px 10px;
                min-height: 38px;
            }
            .formula-row input {
                width: 180px;
                height: 40px;
                font-size: 1.1rem;
            }
            .hint-row-wrap {
                padding: 1px 0;
            }
            .step-progress {
                padding: 2px 0;
                gap: 4px;
            }
            .top-row {
                padding: 2px 0;
            }
            .soluble-row {
                gap: 4px 8px;
                padding: 1px 0;
            }
            .prop-section {
                gap: 2px;
                padding: 2px 0;
            }
            .prop-section .prop-title {
                font-size: 0.85rem;
            }
            .prop-group-wrap {
                gap: 2px 8px;
                padding: 1px 0;
            }
            .prop-group .prop-btn {
                font-size: 0.78rem;
                padding: 2px 12px;
                min-height: 26px;
            }
            .bottom-check-row {
                padding: 3px 0 0;
                margin-top: 2px;
            }
            .feedback-area {
                margin-top: 3px;
            }
        }

        @media (max-width: 768px) {
            .card {
                padding: 0.3rem 0.4rem;
                border-radius: 16px;
                max-height: 100vh;
                height: 100vh;
            }
            .header-left select {
                font-size: 0.55rem;
                max-width: 85px;
            }
            .lang-btn {
                font-size: 0.7rem;
                padding: 2px 8px;
            }
            .top-row {
                flex-wrap: nowrap;
                justify-content: space-between;
                gap: 4px;
            }
            .top-row .spin-box {
                flex: 1;
                min-width: 0;
                padding: 2px 4px;
            }
            .top-row .spin-box .label {
                font-size: 0.4rem;
            }
            .top-row .spin-box .value {
                font-size: 0.85rem;
            }
            .top-row .btn-spin {
                font-size: 0.7rem;
                padding: 3px 8px;
                min-height: 36px;
                min-width: 56px;
            }
            .top-row .operator-plus {
                font-size: 0.8rem;
            }
            .q-row .q-label {
                font-size: 0.65rem;
                min-width: 40px;
                width: 100%;
            }
            .q-options {
                gap: 4px;
                width: 100%;
            }
            .q-options .opt-btn {
                font-size: 0.8rem;
                padding: 4px 10px;
                min-height: 32px;
                flex: 1;
                text-align: center;
            }
            .structure-grid {
                grid-template-columns: 1fr 1fr;
                gap: 4px;
                max-width: 100%;
            }
            .structure-grid .opt-btn {
                font-size: 0.65rem;
                padding: 6px 8px;
                min-height: 34px;
            }
            .prop-group .prop-btn {
                font-size: 0.65rem;
                padding: 2px 8px;
                min-height: 26px;
                flex: 1 0 calc(33.33% - 4px);
                max-width: calc(33.33% - 4px);
                text-align: center;
            }
            .soluble-row {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }
            .soluble-row .sol-label {
                font-size: 0.65rem;
                min-width: auto;
                width: 100%;
            }
            .soluble-row .sol-options {
                justify-content: center;
            }
            .soluble-row .sol-options button {
                font-size: 0.75rem;
                padding: 3px 12px;
                min-height: 30px;
                flex: 1;
            }
            .feedback-area {
                padding: 4px 10px;
                font-size: 0.6rem;
                min-height: 30px;
            }
            .bottom-check-row {
                flex-direction: row;
                justify-content: flex-end;
                gap: 6px;
            }
            .bottom-check-row .btn-check,
            .bottom-check-row .btn-next-question {
                font-size: 0.75rem;
                padding: 6px 16px;
                min-height: 36px;
            }
            .hint-row-wrap .hint-text {
                font-size: 0.5rem;
            }
            .question-area {
                overflow-y: auto;
            }
            .question-area::-webkit-scrollbar {
                width: 3px;
            }
            .question-area::-webkit-scrollbar-thumb {
                background: #c0c8d8;
                border-radius: 10px;
            }
            .formula-row input {
                width: 150px;
                height: 38px;
                font-size: 1rem;
            }
        }

            const tokens = formula.match(/[A-Z][a-z]?\d*|\d+/g);
            if (!tokens || tokens.length < 2) return formula;
            return tokens.reverse().join('');
        }

        // ✅ 正規化使用者輸入：去除 Unicode 下標與空白，如 'Na₂O' → 'Na2O'
        function normalizeFormulaInput(str) {
            if (!str) return '';
            return str.replace(/[₀₁₂₃₄₅₆₇₈₉]/g, '').replace(/\s/g, '');
        }

        // ✅ 更新硬度和機械性質可見性
        function updateHardnessAndMechanicalVisibility(state) {
            const hardnessGroup = D.hardnessGroup;
            const mechanicalWrap = D.mechanicalWrap;

            if (state === 'solid') {
                if (hardnessGroup) hardnessGroup.style.display = 'flex';
                if (mechanicalWrap) mechanicalWrap.style.display = 'flex';

                if (hardnessGroup) hardnessGroup.style.display = 'none';
                if (mechanicalWrap) mechanicalWrap.style.display = 'none';

                ['hard', 'soft', 'brittle', 'malleable', 'ductile'].forEach(key => {
                    if (S.selectedProps.includes(key)) {

                        document.querySelectorAll(`.prop-btn[data-prop="${key}"]`).forEach(b => {
                            b.classList.remove('selected');
                        });

        function resetSelections() {
            S.selectedBonding = null;
            S.selectedStructure = null;
            S.selectedProps = [];
            S.selectedSoluble = null;
            S.selectedState = null;
            S.selectedMp = null;
            S.isAnswered = false;
            // isMetallic 同 isNoble 由 drawElements 控制，唔喺度 reset

            D.formulaInput.className = '';
            D.formulaInput.disabled = true;

        // ✅ Check 制啟用檢查 (已修復)
        function checkPropsEnable() {
            // 計算實際上顯示緊嘅特性數量 (冇 disabled 嘅 prop-btn)
            let visibleProps = 0;
            document.querySelectorAll('.prop-btn').forEach(b => {
                // 只計算真正可見嘅特性按鈕（冇 disabled 且所在群組有顯示）
                if (b.disabled) return;
                const wrap = b.closest('.prop-group-wrap');
                if (wrap && wrap.style.display === 'none') return;
                visibleProps++;
            });

            // 如果已經揀咗常溫狀態同熔點
            if (S.selectedState !== null && S.selectedMp !== null) {
                // 如果冇顯示嘅特性，或者已經揀咗至少一個特性
                if (visibleProps === 0 || S.selectedProps.length > 0) {
                    D.check.disabled = false;
                } else {
                    D.check.disabled = true;
                }
            } else {
                D.check.disabled = true;
            }
        }

        // ============================================================
        // 抽題
        // ============================================================
        function drawElements() {
            if (S.isSpinning) return;

            S.isSpinning = true;
            D.spin.disabled = true;
            D.spin.classList.add('spinning');
            D.spin.textContent = currentLang === 'zh' ? '🌀 旋轉中...' : '🌀 Spinning...';

            let step = 0;
            const total = 8 + Math.floor(Math.random() * 6);

            function doStep() {
                const r1 = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
                const r2 = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
                D.ele1.textContent = r1.symbol;
                D.ele2.textContent = r2.symbol;
                step++;
                if (step < total) {
                    setTimeout(doStep, 60 + step * 15);
                } else {
                    completeSpin();
                }
            }

            function completeSpin() {
                // 重置金屬鍵同貴氣體標記
                S.isMetallic = false;
                S.isNoble = false;
                S.propsOverride = null;

                // Noble Gas 15%
                if (Math.random() < 0.15) {
                    const nobles = ELEMENTS.filter(e => e.type === 'noble');
                    let el = nobles[Math.floor(Math.random() * nobles.length)];
                    // 避免立即抽到同一種貴氣體
                    if ('noble_' + el.symbol === lastQuestionKey) {
                        const others = nobles.filter(n => 'noble_' + n.symbol !== lastQuestionKey);
                        if (others.length) el = others[Math.floor(Math.random() * others.length)];
                    }
                    S.ele1 = el;
                    S.ele2 = null;
                    S.extra = null;
                    S.isNoble = true;
                    S.correctBonding = 'none';
                    S.correctStructure = 'simple_molecular';
                    S.correctFormula = null;
                    S.isSpecialFormula = false;
                    S.specialOptions = null;
                    S.currentSolubility = false;
                    S.currentPolar = null;
                    S.currentState = 'gas';
                    S.isH2O = false;
                    S.isHg = false;
                    S.solubilityType = 'normal';
                    S.formulaDisplay = el.symbol;
                    S.isMetallic = false;
                    lastQuestionKey = 'noble_' + el.symbol;
                } else {
                    // 金屬鍵 20%
                    let selected = null;
                    let attempts = 0;
                    const maxAttempts = 50;

                    while (attempts < maxAttempts) {
                        attempts++;
                        if (Math.random() < 0.20) {
                            const metalPair = PAIRS.metallic[Math.floor(Math.random() * PAIRS.metallic.length)];
                            selected = { e1: metalPair[0], e2: metalPair[1], type: 'metallic', extra: null };
                        } else {
                            const allPairs = [];
                            PAIRS.ionic.forEach(p => allPairs.push({ e1: p[0], e2: p[1], type: 'ionic', extra: null }));
                            PAIRS.covalent.forEach(p => {
                                allPairs.push({ e1: p[0], e2: p[1], type: 'covalent', extra: p.length === 3 ? p[2] :
                                        null });
                            });
                            const rand = allPairs[Math.floor(Math.random() * allPairs.length)];
                            selected = rand;
                        }
                        const qKey = selected.e1 + '_' + selected.e2 + (selected.extra ? '_' + selected.extra : '');
                        if (qKey !== lastQuestionKey) break;
                        selected = null;
                    }

                    if (!selected) {
                        const allPairs = [];
                        PAIRS.ionic.forEach(p => allPairs.push({ e1: p[0], e2: p[1], type: 'ionic', extra: null }));
                        PAIRS.covalent.forEach(p => {
                            allPairs.push({ e1: p[0], e2: p[1], type: 'covalent', extra: p.length === 3 ? p[2] :
                                null });
                        });
                        selected = allPairs[Math.floor(Math.random() * allPairs.length)];
                    }
                    lastQuestionKey = selected.e1 + '_' + selected.e2 + (selected.extra ? '_' + selected.extra : '');

                    S.ele1 = getElement(selected.e1);
                    S.ele2 = getElement(selected.e2);
                    S.extra = selected.extra;
                    S.isNoble = false;
                    S.isH2O = isH2O(S.ele1, S.ele2);
                    S.isHg = isHg(S.ele1, S.ele2);
                    S.isMetallic = (selected.type === 'metallic');

                    if (selected.type === 'ionic') {
                        S.correctBonding = 'ionic';
                        S.correctStructure = 'giant_ionic';
                    } else if (selected.type === 'covalent') {
                        S.correctBonding = 'covalent';
                        if ((selected.e1 === 'Si' && selected.e2 === 'O') ||
                            (selected.e1 === 'O' && selected.e2 === 'Si')) {
                            S.correctStructure = 'giant_covalent';
                        } else if (selected.e1 === 'C' && selected.e2 === 'C') {
                            S.correctStructure = 'giant_covalent';
                        } else if (selected.e1 === 'Si' || selected.e2 === 'Si') {
                            S.correctStructure = 'simple_molecular';
                        } else {
                            S.correctStructure = 'simple_molecular';
                        }
                        // 石墨特例：導電、柔軟（與金剛石不同）
                        if (selected.extra === 'graphite') {
                            S.propsOverride = {
                                state: 'solid', mp: 'high', soluble: false, conduct_solid: true,
                                conduct_liquid: false, conduct_aqueous: false, conduct_no: false,
                                brittle: false, malleable: false, ductile: false, hard: false, soft: true,
                            };
                        }
                    } else if (selected.type === 'metallic') {
                        S.correctBonding = 'metallic';
                        S.correctStructure = 'giant_metallic';
                    }

                    const sol = getSolubility(S.ele1, S.ele2);
                    if (sol !== null) {
                        S.currentSolubility = sol;
                        if (sol === 'reacts') S.solubilityType = 'reacts';
                        else if (sol === 'slightly') S.solubilityType = 'slightly';
                        else if (sol === 'h2o') S.solubilityType = 'h2o';
                        else if (sol === 'mixed') S.solubilityType = 'mixed';
                        else S.solubilityType = 'normal';
                    } else {
const props = S.propsOverride || STRUCTURE_PROPS[S.correctStructure];
                        S.currentSolubility = props ? props.soluble : false;
                        S.solubilityType = 'normal';
                    }

                    S.currentPolar = getPolar(S.ele1, S.ele2);
                    S.currentState = getState(S.ele1, S.ele2);
                    if (S.isHg) S.currentState = 'liquid';

                    const specialOpts = getSpecialFormulaOptions(S.ele1, S.ele2);
                    if (specialOpts) {
                        S.isSpecialFormula = true;
                        S.specialOptions = specialOpts;
                        D.formulaHint.textContent = t('formulaHintSpecial') + ' (' + specialOpts.join(' / ') + ')';
                    } else {
                        S.isSpecialFormula = false;
                        S.specialOptions = null;
                        D.formulaHint.textContent = t('formulaHint');
                    }

                    S.correctFormula = getFormula(S.ele1, S.ele2, S.extra);

                    let display = S.correctFormula || '';
                    if (S.extra === 'ozone') display = 'O₃';
                    else if (S.extra === 'diamond') display = 'C (diamond)';
                    else if (S.extra === 'graphite') display = 'C (graphite)';
                    else if (S.isH2O) display = 'H₂O';
                    else if (S.isMetallic) display = S.ele1.symbol;
                    S.formulaDisplay = display;
                }

                updateDisplay();
                setFeedback('✏️', t('fbSpin'), '', false);
                D.spin.disabled = false;
                D.spin.classList.remove('spinning');
                D.spin.textContent = t('spinBtn');
                S.isSpinning = false;

                resetSelections();
                updateStepUI(0);
                renderStep0();
                setFeedback('✏️', currentLang === 'zh' ? '請選擇鍵結類型' : 'Select bonding type', '', false);
            }

            doStep();
        }

        // ============================================================
        // Step 0: 鍵結
        // ============================================================
        function renderStep0() {
            const btns = D.bonding.querySelectorAll('.opt-btn');
            btns.forEach(b => {
                b.disabled = false;
                b.classList.remove('selected', 'correct', 'wrong');
                b.onclick = function() {
                    if (S.isAnswered || S.step !== 0) return;
                    btns.forEach(btn => btn.classList.remove('selected'));
                    this.classList.add('selected');
                    S.selectedBonding = this.dataset.value;
                    D.check.disabled = false;
                    D.check.onclick = checkStep0;
                };
            });
        }

        function checkStep0() {
            if (S.isAnswered || S.step !== 0) return;
            if (!S.selectedBonding) {
                setFeedback('⚠️', currentLang === 'zh' ? '請選擇一個鍵結類型' : 'Please select a bonding type', '', true);
                return;
            }
            S.isAnswered = true;
            const correct = S.selectedBonding === S.correctBonding;
            const btns = D.bonding.querySelectorAll('.opt-btn');
            btns.forEach(b => {
                b.disabled = true;
                if (b.dataset.value === S.correctBonding) b.classList.add('correct');
                if (b.dataset.value === S.selectedBonding && !correct) b.classList.add('wrong');
            });
            const labels = { ionic: t('bonding_ionic'), covalent: t('bonding_covalent'), metallic: t('bonding_metallic'),
                none: t('bonding_none') };
            if (correct) {
                setFeedback('✅', t('fbBondingCorrect'), '', false);
            } else {
                setFeedback('❌', t('fbBondingWrong') + labels[S.correctBonding], '', true);
            }
            D.check.disabled = true;
            D.next.style.display = 'inline-block';
            D.next.disabled = false;
            D.next.textContent = t('nextStep');
            D.next.onclick = function() {
                resetSelections();
                updateStepUI(1);
                renderStep1();
                setFeedback('✏️', currentLang === 'zh' ? '請輸入化學式' : 'Enter the formula', '', false);
            };
        }

        // ============================================================
        // Step 1: 化學式
        // ============================================================
        function renderStep1() {
            // 金屬鍵跳過
            if (S.isMetallic) {
                const msg = tWith('metalFormula', { symbol: S.ele1.symbol });
                D.step1.classList.add('hidden');
                setFeedback('✅', msg, '', false);
                D.next.style.display = 'inline-block';
                D.next.disabled = false;
                D.next.textContent = t('nextStep');
                D.next.onclick = function() {
                    resetSelections();
                    updateStepUI(2);
                    renderStep2();
                    setFeedback('✏️', currentLang === 'zh' ? '請選擇結構類型' : 'Select structure type', '', false);
                };
                return;
            }

            if (S.isNoble) {
                D.step1.classList.add('hidden');
                setFeedback('✅', t('noReaction'), '', false);
                D.next.style.display = 'inline-block';
                D.next.disabled = false;
                D.next.textContent = t('nextStep');
                D.next.onclick = function() {
                    resetSelections();
                    updateStepUI(2);
                    renderStep2();
                    setFeedback('💡', t('nobleGasStructure'), '', false);
                };
                return;
            }

            // 金剛石/石墨：直接顯示化學式，跳過輸入
            if (S.extra === 'diamond' || S.extra === 'graphite') {
                const msg = currentLang === 'zh'
                    ? '✅ 化學式為 ' + S.formulaDisplay
                    : '✅ Formula is ' + S.formulaDisplay;
                D.step1.classList.add('hidden');
                setFeedback('✅', msg, '', false);
                D.next.style.display = 'inline-block';
                D.next.disabled = false;
                D.next.textContent = t('nextStep');
                D.next.onclick = function() {
                    resetSelections();
                    updateStepUI(2);
                    renderStep2();
                    setFeedback('✏️', currentLang === 'zh' ? '請選擇結構類型' : 'Select structure type', '', false);
                };
                return;
            }

            D.step1.classList.remove('hidden');
            D.formulaInput.disabled = false;
            D.formulaInput.value = '';
            D.formulaInput.className = '';
            D.formulaInput.focus();
            D.check.disabled = true;
            D.formulaInput.oninput = function() {
                if (this.disabled) return;
                D.check.disabled = this.value.trim() === '';
                if (this.value.trim() !== '') {
                    D.check.onclick = checkStep1;
                }
            };
            D.formulaInput.onkeydown = function(e) {
                if (e.key === 'Enter' && !this.disabled && this.value.trim() !== '') {
                    e.preventDefault();
                    D.check.click();
                }
            };
        }

        function checkStep1() {
            if (S.isAnswered || S.step !== 1) return;
            const user = normalizeFormulaInput(D.formulaInput.value.trim());
            if (user === '') {
                setFeedback('⚠️', currentLang === 'zh' ? '請輸入化學式' : 'Please enter the formula', '', true);
                return;
            }
            S.isAnswered = true;
            let correct = false;
            let caseOnlyIssue = false;
            if (S.isSpecialFormula && S.specialOptions) {
                const opts = S.specialOptions.map(normalizeFormulaInput);
                if (opts.includes(user)) {
                    correct = true;
                } else if (opts.some(opt => opt && user.toUpperCase() === opt.toUpperCase())) {
                    caseOnlyIssue = true;
                }
            } else {
                const isCovalent = S.correctBonding === 'covalent';
                const allowReversal = isCovalent && isReversalAllowed(S.ele1, S.ele2);
                const normalFormula = normalizeFormulaInput(S.correctFormula);
                const expectedList = [normalFormula];
                if (allowReversal) expectedList.push(reverseFormula(normalFormula));
                if (expectedList.includes(user)) {
                    correct = true;
                } else if (expectedList.some(opt => opt && user.toUpperCase() === opt.toUpperCase())) {
                    caseOnlyIssue = true;
                }
            }
            D.formulaInput.className = correct ? 'correct' : 'incorrect';
            D.formulaInput.disabled = true;
            if (correct) {
                let detail = '';
                if (S.isSpecialFormula && S.specialOptions) {
                    detail = currentLang === 'zh' ?
                        '✅ 正確！其他可能：' + S.specialOptions.filter(o => o !== user).join('、') :
                        '✅ Correct! Other possibilities: ' + S.specialOptions.filter(o => o !== user).join(', ');
                }
                setFeedback('✅', t('fbFormulaCorrect'), detail, false);
            } else {
                let ans = S.isSpecialFormula ? S.specialOptions.join(' / ') : S.correctFormula;
                if (!S.isSpecialFormula && S.correctBonding === 'covalent' && isReversalAllowed(S.ele1, S.ele2)) {
                    ans = currentLang === 'zh'
                        ? S.correctFormula + ' 或 ' + reverseFormula(S.correctFormula) + '（都可接受）'
                        : S.correctFormula + ' or ' + reverseFormula(S.correctFormula) + ' (both acceptable)';
                }
                const detail = caseOnlyIssue
                    ? (currentLang === 'zh' ? '💡 留意大小寫' : '💡 Mind the capitalization')
                    : '';
                setFeedback('❌', t('fbFormulaWrong') + ans, detail, true);
            }
            D.check.disabled = true;
            D.next.style.display = 'inline-block';
            D.next.disabled = false;
            D.next.textContent = t('nextStep');
            D.next.onclick = function() {
                resetSelections();
                updateStepUI(2);
                renderStep2();
                setFeedback('✏️', currentLang === 'zh' ? '請選擇結構類型' : 'Select structure type', '', false);
            };
        }

        // ============================================================
        // Step 2: 結構
        // ============================================================
        function renderStep2() {
            const btns = D.structure.querySelectorAll('.opt-btn');
            btns.forEach(b => {
                b.disabled = false;
                b.classList.remove('selected', 'correct', 'wrong');
                b.onclick = function() {
                    if (S.isAnswered || S.step !== 2) return;
                    btns.forEach(btn => btn.classList.remove('selected'));
                    this.classList.add('selected');
                    S.selectedStructure = this.dataset.value;
                    D.check.disabled = false;
                    D.check.onclick = checkStep2;
                };
            });
        }

        function checkStep2() {
            if (S.isAnswered || S.step !== 2) return;
            if (!S.selectedStructure) {
                setFeedback('⚠️', currentLang === 'zh' ? '請選擇一個結構類型' : 'Please select a structure type', '', true);
                return;
            }
            S.isAnswered = true;
            const correct = S.selectedStructure === S.correctStructure;
            const btns = D.structure.querySelectorAll('.opt-btn');
            btns.forEach(b => {
                b.disabled = true;
                if (b.dataset.value === S.correctStructure) b.classList.add('correct');
                if (b.dataset.value === S.selectedStructure && !correct) b.classList.add('wrong');
            });
            const labels = {
                giant_ionic: t('structure_giant_ionic'),
                giant_metallic: t('structure_giant_metallic'),
                giant_covalent: t('structure_giant_covalent'),
                simple_molecular: t('structure_simple_molecular'),
            };
            if (correct) {
                setFeedback('✅', t('fbStructureCorrect'), '', false);
            } else {
                setFeedback('❌', t('fbStructureWrong') + labels[S.correctStructure], '', true);
            }
            D.check.disabled = true;
            D.next.style.display = 'inline-block';
            D.next.disabled = false;
            D.next.textContent = t('nextStep');
            D.next.onclick = function() {
                resetSelections();
                updateStepUI(3);
                renderStep3();
                setFeedback('✏️', currentLang === 'zh' ? '請選擇該結構的特性' : 'Select properties', '', false);
            };
        }

        // ============================================================
        // Step 3: 特性
        // ============================================================
        function renderStep3() {
            updatePropTitle();

            // H₂O 特例
            if (S.isH2O) {
                D.solubilityRow.style.display = 'none';
                setFeedback('💧', t('h2oInfo'), '', false);
            } else {
                D.solubilityRow.style.display = 'flex';
                if (S.solubilityType === 'reacts') {
                    D.solOpts.style.display = 'none';
                    D.solLabel.innerHTML = t('solLabel') + '<br><span class="reacts-hint">' + t('reactsWithWater') + '</span>';
                } else {
                    D.solOpts.style.display = 'flex';
                    D.solLabel.textContent = t('solLabel');
                    D.solLabel.style.color = '';
                    D.solLabel.style.fontWeight = '';
                    if (S.solubilityType === 'slightly') {
                        D.solLabel.innerHTML = t('solLabel') + ' <span class="reacts-hint">' + t('slightlySoluble') + '</span>';
                    } else if (S.solubilityType === 'mixed') {
                        D.solLabel.innerHTML = t('solLabel') + ' <span class="reacts-hint">' + t('cl2SolubilityHint') + '</span>';
                    }
                }
            }

            // 常溫狀態
            const stateBtns = D.stateOpts.querySelectorAll('.opt-btn');
            stateBtns.forEach(b => {
                b.disabled = false;
                b.classList.remove('selected', 'correct', 'wrong');
                b.onclick = function() {
                    if (S.isAnswered || S.step !== 3) return;
                    stateBtns.forEach(btn => btn.classList.remove('selected'));
                    this.classList.add('selected');
                    S.selectedState = this.dataset.value;
                    updateHardnessAndMechanicalVisibility(S.selectedState);
                    checkPropsEnable();
                };
            });

            // 熔點
            const mpBtns = D.mpOpts.querySelectorAll('.opt-btn');
            mpBtns.forEach(b => {
                b.disabled = false;
                b.classList.remove('selected', 'correct', 'wrong');
                b.onclick = function() {
                    if (S.isAnswered || S.step !== 3) return;
                    mpBtns.forEach(btn => btn.classList.remove('selected'));
                    this.classList.add('selected');
                    S.selectedMp = this.dataset.value;
                    checkPropsEnable();
                };
            });

            // 溶解度 (除非係 reacts 或 h2o)
            if (S.solubilityType !== 'reacts' && !S.isH2O) {
                const solBtns = D.solOpts.querySelectorAll('.opt-btn');
                solBtns.forEach(b => {
                    b.disabled = false;
                    b.classList.remove('selected', 'correct', 'wrong');
                    b.onclick = function() {
                        if (S.isAnswered || S.step !== 3) return;
                        solBtns.forEach(btn => btn.classList.remove('selected'));
                        this.classList.add('selected');
                        S.selectedSoluble = this.dataset.value;
                        checkPropsEnable();
                        if (this.dataset.value === 'insoluble') {
                            const aq = document.querySelector('.prop-btn[data-prop="conduct_aqueous"]');
                            if (aq) { aq.disabled = true;
                                aq.classList.remove('selected');
                                S.selectedProps = S.selectedProps.filter(p => p !== 'conduct_aqueous'); }
                        } else {
                            const aq = document.querySelector('.prop-btn[data-prop="conduct_aqueous"]');
                            if (aq) aq.disabled = false;
                        }
                    };
                });
            }

            // 其他特性
            document.querySelectorAll('.prop-btn').forEach(b => {
                b.disabled = false;
                b.classList.remove('selected', 'correct', 'wrong');
                b.onclick = function() {
                    if (S.isAnswered || S.step !== 3) return;
                    const key = this.dataset.prop;
                    if (key === 'conduct_aqueous' && S.selectedSoluble === 'insoluble') {
                        setFeedback('⚠️', currentLang === 'zh' ? '不溶於水，不能選水溶液導電' : 'Insoluble in water, cannot select aqueous conductivity',
                            '', true);
                        return;
                    }
                    if (S.selectedProps.includes(key)) {
                        S.selectedProps = S.selectedProps.filter(p => p !== key);
                        this.classList.remove('selected');
                    } else {
                        S.selectedProps.push(key);
                        this.classList.add('selected');
                    }
                    checkPropsEnable();
                };
            });

            // 硬度和機械性質初始顯示
            D.hardnessGroup.style.display = 'flex';
            D.mechanicalWrap.style.display = 'flex';

            D.check.disabled = true;
            D.check.onclick = checkStep3;

            if (S.selectedState) {
                updateHardnessAndMechanicalVisibility(S.selectedState);
            }
            // 呼叫 checkPropsEnable 檢查按鈕狀態
            checkPropsEnable();
        }

        function checkStep3() {
            if (S.isAnswered || S.step !== 3) return;

            const props = S.propsOverride || STRUCTURE_PROPS[S.correctStructure];
            if (!props) {
                setFeedback('⚠️', '結構資料錯誤', '', true);
                return;
            }
            let slightHint = '';

            // 常溫狀態
            let stateOk = true,
                stateFeedback = '';
            if (S.selectedState === null) {
                setFeedback('⚠️', currentLang === 'zh' ? '請選擇常溫狀態' : 'Please select state at RTP', '', true);
                return;
            }
            const realState = S.currentState;
            const isKnown = isKnownState(S.ele1, S.ele2, S.extra);
            const isSimple = S.correctStructure === 'simple_molecular';
            const stateLabels = currentLang === 'zh' ? { solid: '固態', liquid: '液態', gas: '氣態' } : { solid: 'solid',
                liquid: 'liquid', gas: 'gas' };

            if (isKnown || !isSimple || !realState) {
                const expected = realState || props.state;
                stateOk = (S.selectedState === expected);
                if (!stateOk) {
                    stateFeedback = tWith('stateFeedback', { formula: S.formulaDisplay, state: stateLabels[expected] ||
                            expected });
                }
            } else {
                if (realState === 'liquid') {
                    stateOk = (S.selectedState === 'gas' || S.selectedState === 'liquid');
                } else if (realState === 'solid') {
                    stateOk = true;
                } else {
                    stateOk = (S.selectedState === realState);
                }
                if (S.selectedState !== realState && stateOk) {
                    stateFeedback = tWith('stateFeedbackGas', { formula: S.formulaDisplay, state: stateLabels[
                        realState] || realState });
                }
            }

            // 熔點
            let mpOk = true;
            if (S.selectedMp === null) {
                setFeedback('⚠️', currentLang === 'zh' ? '請選擇熔點' : 'Please select melting point', '', true);
                return;
            }
            if (S.isHg) {
                mpOk = true;
            } else {
                mpOk = (S.selectedMp === props.mp);
            }

            // 溶解度
            let solOk = true;
            let expectedSoluble = S.currentSolubility;
            if (S.isH2O) {
                solOk = true;
            } else if (S.solubilityType === 'reacts') {
                solOk = true;
            } else if (S.solubilityType === 'slightly') {
                if (S.selectedSoluble === null) {
                    setFeedback('⚠️', currentLang === 'zh' ? '請選擇溶解度' : 'Please select solubility', '', true);
                    return;
                }
                solOk = true;
                slightHint = t('slightlySoluble');
            } else if (S.solubilityType === 'mixed') {
                if (S.selectedSoluble === null) {
                    setFeedback('⚠️', currentLang === 'zh' ? '請選擇溶解度' : 'Please select solubility', '', true);
                    return;
                }
                solOk = true;
                slightHint = t('cl2SolubilityHint');
            } else {
                if (S.selectedSoluble === null) {
                    setFeedback('⚠️', currentLang === 'zh' ? '請選擇溶解度' : 'Please select solubility', '', true);
                    return;
                }
                const userSoluble = S.selectedSoluble === 'soluble';
                solOk = (userSoluble === expectedSoluble);
            }

            // 其他特性
            const propKeys = ['conduct_solid', 'conduct_liquid', 'conduct_aqueous', 'conduct_no',
                'brittle', 'malleable', 'ductile', 'hard', 'soft'
            ];
            const filteredKeys = propKeys.filter(k => {
                if (k === 'conduct_aqueous' && (!expectedSoluble || S.solubilityType === 'reacts')) return false;
                if ((k === 'hard' || k === 'soft') && S.selectedState !== 'solid') return false;
                return true;
            });
            let wrong = 0,
                missing = 0;
            S.selectedProps.forEach(k => {
                if (k === 'conduct_aqueous' && (!expectedSoluble || S.solubilityType === 'reacts')) { wrong++; return; }
                if ((k === 'hard' || k === 'soft') && S.selectedState !== 'solid') { wrong++; return; }
                if (props[k] !== true) wrong++;
            });
            filteredKeys.forEach(k => {
                if (props[k] === true && !S.selectedProps.includes(k)) missing++;
            });
            const propsOk = (wrong === 0 && missing === 0);

            // 高亮
            document.querySelectorAll('.prop-btn').forEach(b => {
                b.disabled = true;
                const k = b.dataset.prop;
                if (k === 'conduct_aqueous' && (!expectedSoluble || S.solubilityType === 'reacts')) {
                    b.classList.add('correct');
                    return;
                }
                if ((k === 'hard' || k === 'soft') && S.selectedState !== 'solid') {
                    b.classList.add('correct');
                    return;
                }
                if (props[k] === true) b.classList.add('correct');
                else if (S.selectedProps.includes(k) && props[k] !== true) b.classList.add('wrong');
                if (S.selectedProps.includes(k) && props[k] === true) b.classList.add('correct');
            });

            // 高亮 solubility
            D.solOpts.querySelectorAll('.opt-btn').forEach(b => {
                b.disabled = true;
                const val = b.dataset.value;
                let isCorrect = false;
                if (S.solubilityType === 'slightly' || S.solubilityType === 'mixed') isCorrect = true;
                else if (S.isH2O || S.solubilityType === 'reacts') isCorrect = true;
                else isCorrect = (val === 'soluble') === expectedSoluble;
                if (val === S.selectedSoluble) {
                    if (isCorrect) b.classList.add('correct');
                    else b.classList.add('wrong');
                }
                if (isCorrect && val !== S.selectedSoluble && S.solubilityType !== 'slightly' && S.solubilityType !== 'mixed') {
                    b.classList.add('correct');
                }
            });

            // 高亮 state
            D.stateOpts.querySelectorAll('.opt-btn').forEach(b => {
                b.disabled = true;
                const val = b.dataset.value;
                let isCorrect = false;
                const isKnownCpd = isKnownState(S.ele1, S.ele2, S.extra);
                const isSimpleMol = S.correctStructure === 'simple_molecular';
                if (isKnownCpd || !isSimpleMol || !realState) {
                    const expected = realState || props.state;
                    isCorrect = val === expected;
                } else {
                    if (realState === 'liquid') isCorrect = (val === 'gas' || val === 'liquid');
                    else if (realState === 'solid') isCorrect = true;
                    else isCorrect = val === realState;
                }
                if (val === S.selectedState) {
                    if (isCorrect) b.classList.add('correct');
                    else b.classList.add('wrong');
                }
                if (isCorrect && val !== S.selectedState) b.classList.add('correct');
            });

            // 高亮 mp (Hg 特例)
            D.mpOpts.querySelectorAll('.opt-btn').forEach(b => {
                b.disabled = true;
                const val = b.dataset.value;
                let isCorrect = false;
                if (S.isHg) isCorrect = true;
                else isCorrect = val === props.mp;
                if (val === S.selectedMp) {
                    if (isCorrect) b.classList.add('correct');
                    else b.classList.add('wrong');
                }
                if (isCorrect && val !== S.selectedMp) b.classList.add('correct');
            });

            // 極性提示
            let polarHint = '';
            if (!solOk && S.currentPolar !== null && S.correctStructure === 'simple_molecular') {
                const polarLabel = S.currentPolar ? t('isPolar') : t('isNonPolar');
                const name = S.ele1.symbol + S.ele2.symbol;
                polarHint = tWith('polarHint', { name: name, polar: polarLabel });
            }

            const allCorrect = stateOk && mpOk && solOk && propsOk;
            S.isAnswered = true;

            if (allCorrect) {
                let detail = [stateFeedback, polarHint, slightHint].filter(Boolean).join('；');
                setFeedback('✅', t('fbPropsCorrect'), detail, false);
                D.check.disabled = true;
                D.next.style.display = 'inline-block';
                D.next.disabled = false;
                D.next.textContent = t('nextBtn');
                D.next.onclick = drawElements;
            } else {
                let detail = '';
                if (!stateOk) {
                    detail += (currentLang === 'zh' ? '常溫狀態錯誤' : 'State at RTP wrong');
                    if (stateFeedback) detail += '；' + stateFeedback;
                }
                if (!mpOk && !S.isHg) {
                    if (detail) detail += '；';
                    detail += (currentLang === 'zh' ? '熔點錯誤' : 'Melting point wrong');
                }
                if (!solOk) {
                    if (detail) detail += '；';
                    const expected = expectedSoluble ?
                        (currentLang === 'zh' ? '可溶' : 'soluble') :
                        (currentLang === 'zh' ? '不溶' : 'insoluble');
                    detail += (currentLang === 'zh' ? `溶解度應為 ${expected}` : `Solubility should be ${expected}`);
                }
                if (!propsOk) {
                    let missingList = [],
                        extraList = [];
                    filteredKeys.forEach(k => {
                        if (props[k] === true && !S.selectedProps.includes(k)) missingList.push(t('prop_' + k));
                        if (props[k] !== true && S.selectedProps.includes(k)) extraList.push(t('prop_' + k));
                    });
                    if (S.selectedProps.includes('conduct_aqueous') && (!expectedSoluble || S.solubilityType ===
                        'reacts')) {
                        extraList.push(t('prop_conduct_aqueous'));
                    }
                    if ((S.selectedProps.includes('hard') || S.selectedProps.includes('soft')) && S.selectedState !== 'solid') {
                        extraList.push(t('hardnessNotApplicable'));
                    }
                    if (missingList.length > 0) {
                        if (detail) detail += '；';
                        detail += t('fbPropsMissing') + missingList.join('、');
                    }
                    if (extraList.length > 0) {
                        if (detail) detail += '；';
                        detail += t('fbPropsExtra') + extraList.join('、');
                    }
                }
                if (polarHint) {
                    if (detail) detail += '；';
                    detail += polarHint;
                }
                if (slightHint) {
                    if (detail) detail += '；';
                    detail += slightHint;
                }
                setFeedback('❌', t('fbPropsWrong'), detail, true);
                D.check.disabled = true;
                D.next.style.display = 'inline-block';
                D.next.disabled = false;
                D.next.textContent = t('nextBtn');
                D.next.onclick = drawElements;
            }
        }

        // ============================================================
        // 語言切換
        // ============================================================
        function setLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url);
            updateButtonLabels();
            localStorage.setItem('structure_lang', lang);
        }

        // 🔍 偵測瀏覽器縮放，非 100% 時顯示提示橫幅
        function detectZoom() {
            const banner = document.getElementById('zoomBanner');
            if (!banner) return;
            const ratio = window.outerWidth / window.innerWidth;
            if (ratio > 1.03 || ratio < 0.97) {
                banner.textContent = t('zoomHint');
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            const urlLang = getUrlParameter('lang') || localStorage.getItem('structure_lang') || 'zh';
            currentLang = (urlLang === 'zh' || urlLang === 'en') ? urlLang : 'zh';

            const sel = document.getElementById('practiceSelector');
            if (sel) {
                for (let i = 0; i < sel.options.length; i++) {
                    if (sel.options[i].value === 'structure') {
                        sel.options[i].selected = true;
                        break;
                    }
                }
                sel.addEventListener('change', function() {
                    const target = this.value;
                    const lang = currentLang || 'zh';
                    if (target === 'home') window.location.href = 'index.html?lang=' + lang;
                    else window.location.href = target + '.html?lang=' + lang;
                });
            }

            D.langBtns.forEach(b => {
                b.addEventListener('click', () => setLanguage(b.dataset.lang));
            });

            D.spin.addEventListener('click', drawElements);

            window.addEventListener('resize', detectZoom);
            detectZoom();

            updateButtonLabels();
            drawElements();
            console.log('🏗️ 結構練習已啟動 (Ch.9)');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
