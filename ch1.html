        }
        body {

            align-items: flex-start;
            padding: 6px;
        }

        .card {
            max-width: 900px;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            max-height: 100dvh;
            background: rgba(255, 255, 255, 0.94);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(30, 90, 70, 0.15);
            padding: 0.5rem 1rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(120, 190, 160, 0.25);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            flex-shrink: 0;
        }
        .header-left select {
            font-size: 0.95rem;
            font-weight: 700;
            color: #2a5a4a;
            background: transparent;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 4px 0;
            max-width: 200px;
        }
        .header-left select option {
            font-weight: 600;
        }
        .lang-toggle {
            display: flex;
            gap: 2px;
            background: white;
            padding: 2px;
            border-radius: 30px;
            flex-shrink: 0;
        }
        .lang-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: #5a7a6a;
        }
        .lang-btn.active {
            background: #2a8a6a;
            color: white;
        }

        .tab-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .tab-btn {
            border: 2px solid #cfe0d8;
            background: white;
            padding: 6px 18px;
            border-radius: 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            color: #2a5a4a;
            transition: 0.15s;
        }
        .tab-btn.active {
            background: #2a8a6a;
            color: white;
            border-color: #2a8a6a;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #5a7a6a;
            font-weight: 600;
            padding: 2px 0;
            flex-shrink: 0;
        }

        .question-area {
            flex: 1;
            min-height: 0;
            padding: 0.3rem;
            overflow-y: auto;
            overflow-x: hidden;
            background: white;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
        }
        .question-area::-webkit-scrollbar {
            width: 6px;
        }
        .question-area::-webkit-scrollbar-thumb {
            background: #c0d8cc;
            border-radius: 10px;
        }

        .hint-row-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px 0;
            flex-shrink: 0;
        }
        .hint-text {
            font-size: 0.95rem;
            color: #5a7a6a;
            font-weight: 500;
        }

        .image-box {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7fbfa;
            border-radius: 14px;
            border: 2px dashed #cfe0d8;
            margin: 4px 0;
            overflow: hidden;
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .image-fallback {
            color: #8a9a92;
            font-size: 0.9rem;
            text-align: center;
            padding: 20px;
            word-break: break-all;
        }

        .q-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 4px 0;
            flex-shrink: 0;
        }
        .opt-btn {
            border: 2px solid #d0e0d8;
            background: white;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            color: #2a3a32;
            min-height: 48px;
            transition: 0.15s;
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
        }
        .opt-btn:hover:not(:disabled) {
            background: #eefaf5;
        }
        .opt-btn.selected {
            border-color: #2a8a6a;
            background: #2a8a6a;
            color: white;
        }
        .opt-btn.correct {
            border-color: #22c55e;
            background: #22c55e;
            color: white;
        }
        .opt-btn.wrong {
            border-color: #ef4444;
            background: #ef4444;
            color: white;
        }
        .opt-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback-area {
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            background: #e8f5e8;
            border: 2px solid #6bcb77;
            color: #0d553a;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-height: 40px;
            flex-shrink: 0;

        .feedback-area.error {
            background: #fce8e8;
            border-color: #e74c3c;
            color: #7a2a2a;
        }
        .fb-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fb-text {
            font-weight: 700;
        }
        .fb-detail {
            font-size: 0.9rem;
            font-weight: 500;
            color: #5a5a7a;
            padding-left: 28px;
        }

            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 4px 0 0;
            flex-shrink: 0;
        }

            background: linear-gradient(145deg, #34a87e, #2a8a6a);

            border: none;
            border-radius: 30px;
            padding: 6px 22px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 38px;
            white-space: nowrap;
        }
        .btn-check:disabled {

            cursor: not-allowed;
        }
        .btn-next-question {
            background: linear-gradient(145deg, #6a9aba, #4a7a9a);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            min-height: 38px;

        }

            roundPos: { hazard: 0, apparatus: 0 },
            roundTotal: { hazard: 0, apparatus: 0 },
            total: 0,
            correct: 0,
        };

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // 牌組循環：洗牌後依序出題，全數看完才重洗
        function nextFromDeck() {
            if (S.decks[S.tab].length === 0) {
                S.decks[S.tab] = shuffle(QUESTION_BANK.filter(q => q.tab === S.tab));
                S.roundTotal[S.tab] = S.decks[S.tab].length;
                S.roundPos[S.tab] = 0;
            }
            const q = S.decks[S.tab].pop();
            S.roundPos[S.tab]++;
            return q;
        }

        function setFeedback(icon, text, detail, isError) {
            const fb = document.getElementById('feedback0');
            fb.classList.toggle('error', !!isError);
            fb.querySelector('.fb-icon').textContent = icon;
            document.getElementById('fbText0').textContent = text;
            document.getElementById('fbDetail0').textContent = detail || '';
        }

        function updateScore() {
            document.getElementById('scoreText').textContent = t('score')
                .replace('{c}', S.correct).replace('{t}', S.total);
            document.getElementById('progressText').textContent = t('progress')
                .replace('{p}', S.roundPos[S.tab]).replace('{t}', S.roundTotal[S.tab] || '—');
        }

        function renderOptions() {
            const opts = document.querySelectorAll('#optGroup .opt-btn');
            opts.forEach((btn, pos) => {
                const orig = S.order[pos];
                btn.textContent = (currentLang === 'zh' ? S.q.opt_zh[orig] : S.q.opt[orig]);
                btn.dataset.key = orig;
            });
        }

        function draw() {
            const q = nextFromDeck();

            S.q = q;
            S.isAnswered = false;
            S.selected = null;
            S.order = shuffle([0, 1, 2, 3]);

            const img = document.getElementById('questionImg');
            const fb = document.getElementById('imgFallback');
            img.onerror = function() {
                img.style.display = 'none';
                fb.textContent = t('imgError') + ' (' + IMG_BASE + q.img + ')';
                fb.style.display = 'block';
            };
            img.onload = function() {
                img.style.display = 'block';
                fb.style.display = 'none';
            };
            img.src = IMG_BASE + q.img;

            const opts = document.querySelectorAll('#optGroup .opt-btn');
            opts.forEach((btn, pos) => {
                btn.classList.remove('selected', 'correct', 'wrong');
                btn.disabled = false;
                btn.onclick = function() {
                    if (S.isAnswered) return;
                    opts.forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    S.selected = parseInt(btn.dataset.key, 10);
                    document.getElementById('checkBtn').disabled = false;
                };
            });
            renderOptions();

            setFeedback('✏️', t('fbStart'), '', false);
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('nextBtn').style.display = 'none';
            updateScore();
        }

        function check() {
            if (S.isAnswered || !S.q) return;
            if (S.selected === null) {
                setFeedback('⚠️', t('pick'), '', true);
                return;
            }
            S.isAnswered = true;
            S.total++;
            const correctOrig = S.q.correct - 1;
            const isCorrect = (S.selected === correctOrig);
            if (isCorrect) S.correct++;

            const opts = document.querySelectorAll('#optGroup .opt-btn');
            opts.forEach(btn => {
                btn.disabled = true;
                const orig = parseInt(btn.dataset.key, 10);
                if (orig === correctOrig) btn.classList.add('correct');
                else if (orig === S.selected && !isCorrect) btn.classList.add('wrong');
            });

            const correctLabel = currentLang === 'zh' ? S.q.opt_zh[correctOrig] : S.q.opt[correctOrig];
            const explain = currentLang === 'zh' ? S.q.explain_zh : S.q.explain;
            if (isCorrect) {
                setFeedback('✅', t('correct'), explain, false);
            } else {
                setFeedback('❌', t('wrong') + correctLabel, explain, true);
            }
            document.getElementById('checkBtn').disabled = true;
            document.getElementById('nextBtn').style.display = 'inline-block';
            updateScore();
        }

        // ============================================================
        // 分頁
        // ============================================================
        function setTab(tab) {
            if (S.tab === tab) return;
            S.tab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            draw();
        }

        // ============================================================
        // 語言切換
        // ============================================================
        function setLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url);
            localStorage.setItem('ch1_lang', lang);
            updateButtonLabels();
            if (S.q) renderOptions();
        }

        function updateButtonLabels() {
            document.getElementById('hintText').textContent = t('hint');
            document.getElementById('tabHazard').textContent = t('tabHazard');
            document.getElementById('tabApparatus').textContent = t('tabApparatus');
            document.getElementById('checkBtn').textContent = t('check');
            document.getElementById('nextBtn').textContent = t('next');
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));

            const sel = document.getElementById('practiceSelector');
            if (sel) {
                const labels = {
                    home: currentLang === 'zh' ? '🏠 返回目錄' : '🏠 Home',
                    ch1: currentLang === 'zh' ? '⚗️ 儀器與標籤 (Ch.1)' : '⚗️ Apparatus & Labels (Ch.1)',
                    ch2: currentLang === 'zh' ? '🔬 特性變化分類 (Ch.2)' : '🔬 Properties & Changes (Ch.2)',
                    detective: currentLang === 'zh' ? '🕵️ 偵探訓練' : '🕵️ Detective Training',
                    ch5: currentLang === 'zh' ? '⚛️ 原子與周期表 (Ch.5/6)' : '⚛️ Atoms & Periodic Table (Ch.5/6)',
                    ions: currentLang === 'zh' ? '🧪 離子與化合物 (Ch.7)' : '🧪 Ionic Compounds (Ch.7)',
                    structure: currentLang === 'zh' ? '🏗️ 結構 (Ch.9)' : '🏗️ Structure (Ch.9)',
                    rxn: currentLang === 'zh' ? '⚙️ 金屬反應 (Ch.11)' : '⚙️ Metal Reactions (Ch.11)',
                };
                for (let i = 0; i < sel.options.length; i++) {
                    const val = sel.options[i].value;
                    if (labels[val]) sel.options[i].textContent = labels[val];
                }
            }
            updateScore();
        }

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            const urlLang = new URLSearchParams(window.location.search).get('lang') || localStorage.getItem('ch1_lang') || 'zh';
            currentLang = (urlLang === 'zh' || urlLang === 'en') ? urlLang : 'zh';

            document.querySelectorAll('.lang-btn').forEach(b => {
                b.addEventListener('click', () => setLanguage(b.dataset.lang));
            });
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.addEventListener('click', () => setTab(b.dataset.tab));
            });
            document.getElementById('checkBtn').addEventListener('click', check);
            document.getElementById('nextBtn').addEventListener('click', draw);

            const sel = document.getElementById('practiceSelector');
            if (sel) {
                sel.addEventListener('change', function() {
                    const target = this.value;
                    if (target === 'home') window.location.href = 'index.html?lang=' + currentLang;
                    else window.location.href = target + '.html?lang=' + currentLang;
                });
            }

            updateButtonLabels();
            draw();
            console.log('⚗️ 儀器與標籤練習已啟動 (Ch.1)');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
