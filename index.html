<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>📁 Mastering Science · DSE 化學</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background: linear-gradient(145deg, #f0f4ff 0%, #d4dcec 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 2rem 1.8rem 2.2rem;
            box-shadow: 0 20px 50px rgba(40, 60, 120, 0.12);
            border: 1px solid rgba(180, 200, 220, 0.25);
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a2332;
            letter-spacing: -0.5px;
        }
        .header h1 span {
            font-size: 1rem;
            font-weight: 400;
            color: #6b7a8e;
        }

        .lang-toggle {
            display: flex;
            gap: 4px;
            background: white;
            padding: 3px;
            border-radius: 30px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .lang-btn {
            padding: 5px 14px;
            border: none;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            background: transparent;
            color: #5a6a8a;
        }
        .lang-btn.active {
            background: #4a6a9a;
            color: white;
            box-shadow: 0 2px 8px rgba(74, 106, 154, 0.3);
        }
        .lang-btn:hover:not(.active) {
            background: #e8eef8;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #6b7a8e;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 2px dashed #e2e8f0;
            font-weight: 500;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .topic-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 12px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            text-decoration: none;
            color: #1a2332;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            gap: 4px;
            min-height: 90px;
        }

        .topic-btn:hover {
            transform: translateY(-3px);
            border-color: #4a6a9a;
            box-shadow: 0 8px 25px rgba(74, 106, 154, 0.12);
        }

        .topic-btn .topic-icon {
            font-size: 2rem;
            line-height: 1.2;
        }

        .topic-btn .topic-name {
            font-size: 1rem;
            font-weight: 700;
            color: #1a2332;
        }

        .topic-btn .topic-sub {
            font-size: 0.75rem;
            font-weight: 500;
            color: #8a9aaa;
        }

        .footer {
            font-size: 0.75rem;
            color: #8a9aaa;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 1px solid #eef2f7;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* ===== 手機版 ===== */
        @media (max-width: 500px) {
            .container {
                padding: 1.2rem 1rem 1.6rem;
                border-radius: 24px;
            }
            .header h1 {
                font-size: 1.2rem;
            }
            .header h1 span {
                font-size: 0.75rem;
            }
            .lang-btn {
                font-size: 0.65rem;
                padding: 3px 10px;
            }
            .subtitle {
                font-size: 0.75rem;
                margin-bottom: 14px;
                padding-bottom: 10px;
            }
            .topic-grid {
                gap: 8px;
            }
            .topic-btn {
                padding: 14px 8px;
                min-height: 72px;
                border-radius: 14px;
            }
            .topic-btn .topic-icon {
                font-size: 1.6rem;
            }
            .topic-btn .topic-name {
                font-size: 0.85rem;
            }
            .topic-btn .topic-sub {
                font-size: 0.6rem;
            }
            .footer {
                font-size: 0.6rem;
                flex-direction: column;
                align-items: center;
                gap: 2px;
            }
        }

        @media (max-width: 380px) {
            .topic-grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .topic-btn {
                min-height: 56px;
                padding: 10px 8px;
                flex-direction: row;
                gap: 10px;
            }
            .topic-btn .topic-icon {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📁 Mastering Science <span>DSE 化學</span></h1>
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="zh" id="langZh">中文</button>
                <button class="lang-btn" data-lang="en" id="langEn">English</button>
            </div>
        </div>

        <div class="subtitle" id="subtitle">選擇課題開始練習</div>

        <div class="topic-grid">
            <!-- Ch.7 離子與化合物 -->
            <a class="topic-btn" id="topicIons" href="ions.html?lang=zh">
                <span class="topic-icon">🧪</span>
                <span class="topic-name" id="ionsName">離子與化合物</span>
                <span class="topic-sub" id="ionsSub">Ionic Compounds · Ch.7</span>
            </a>

            <!-- Ch.9 結構 -->
            <a class="topic-btn" id="topicStructure" href="structure.html?lang=zh">
                <span class="topic-icon">🏗️</span>
                <span class="topic-name" id="structureName">結構</span>
                <span class="topic-sub" id="structureSub">Structure · Ch.9</span>
            </a>

            <!-- Ch.11 金屬反應 -->
            <a class="topic-btn" id="topicRxn" href="rxn.html?lang=zh" style="grid-column: 1 / -1; max-width: 50%; justify-self: center; min-width: 200px;">
                <span class="topic-icon">⚙️</span>
                <span class="topic-name" id="rxnName">金屬反應</span>
                <span class="topic-sub" id="rxnSub">Metal Reactions · Ch.11</span>
            </a>
        </div>

        <div class="footer">
            <span id="footerLeft">💡 按課題開始練習</span>
            <span id="footerRight">DSE Chemistry · 持續更新中</span>
        </div>
    </div>

    <script>
        // ============================================================
        // 語言系統
        // ============================================================
        let currentLang = 'zh';

        const LANG = {
            zh: {
                subtitle: '選擇課題開始練習',
                ionsName: '離子與化合物',
                ionsSub: 'Ionic Compounds · Ch.7',
                structureName: '結構',
                structureSub: 'Structure · Ch.9',
                rxnName: '金屬反應',
                rxnSub: 'Metal Reactions · Ch.11',
                footerLeft: '💡 按課題開始練習',
                footerRight: 'DSE Chemistry · 持續更新中',
                title: '📁 Mastering Science DSE 化學',
            },
            en: {
                subtitle: 'Select a topic to start',
                ionsName: 'Ionic Compounds',
                ionsSub: 'Ionic Compounds · Ch.7',
                structureName: 'Structure',
                structureSub: 'Structure · Ch.9',
                rxnName: 'Metal Reactions',
                rxnSub: 'Metal Reactions · Ch.11',
                footerLeft: '💡 Select a topic to start',
                footerRight: 'DSE Chemistry · Continuously updated',
                title: '📁 Mastering Science DSE Chemistry',
            }
        };

        function t(key) {
            return LANG[currentLang][key] || key;
        }

        function updateLanguage() {
            document.getElementById('subtitle').textContent = t('subtitle');
            document.getElementById('ionsName').textContent = t('ionsName');
            document.getElementById('ionsSub').textContent = t('ionsSub');
            document.getElementById('structureName').textContent = t('structureName');
            document.getElementById('structureSub').textContent = t('structureSub');
            document.getElementById('rxnName').textContent = t('rxnName');
            document.getElementById('rxnSub').textContent = t('rxnSub');
            document.getElementById('footerLeft').textContent = t('footerLeft');
            document.getElementById('footerRight').textContent = t('footerRight');
            document.querySelector('.header h1').innerHTML = t('title');

            // 更新 URL 參數
            const btns = document.querySelectorAll('.topic-btn');
            btns.forEach(btn => {
                const href = btn.getAttribute('href');
                if (href) {
                    const url = new URL(href, window.location.href);
                    url.searchParams.set('lang', currentLang);
                    btn.setAttribute('href', url.toString());
                }
            });

            // 語言按鈕
            document.querySelectorAll('.lang-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.lang === currentLang);
            });

            localStorage.setItem('index_lang', currentLang);
        }

        function setLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.replaceState({}, '', url);
            updateLanguage();
        }

        // ============================================================
        // 初始化
        // ============================================================
        function init() {
            const urlLang = new URLSearchParams(window.location.search).get('lang');
            const storedLang = localStorage.getItem('index_lang');
            const defaultLang = urlLang || storedLang || 'zh';

            if (['zh', 'en'].includes(defaultLang)) {
                currentLang = defaultLang;
            } else {
                currentLang = 'zh';
            }

            document.querySelectorAll('.lang-btn').forEach(b => {
                b.addEventListener('click', () => setLanguage(b.dataset.lang));
            });

            updateLanguage();
        }

        document.addEventListener('DOMContentLoaded', init);
        console.log('📁 Mastering Science 主頁已啟動');
    </script>
</body>
</html>
